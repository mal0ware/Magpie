<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Magpie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111113'/><circle cx='16' cy='16' r='7' fill='none' stroke='%234c8dff' stroke-width='3'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <h1>Magpie</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button id="sync" data-action="sync">Sync</button>
  <button id="pull" data-action="pull">Pull</button>
  <span class="sep"></span>
  <button id="last30" title="Select the 30 most recently saved">Last 30</button>
  <button id="freeOld" title="Delete the video files of older posts; transcripts stay">Free old videos…</button>
  <button id="free" hidden title="Delete the video files; thumbnails, captions and transcripts stay">Free video</button>
  <button id="remove" hidden title="Take out of the roll and delete from this computer; stays saved on Instagram">Remove</button>
  <button id="unsave" hidden class="danger" title="Unsave on Instagram and remove from the roll">Unsave</button>
  <button id="clear" hidden>Clear</button>
  <button id="copy" class="primary" disabled>Copy merged transcripts</button>
</header>
<div class="job" id="job" hidden><i class="spin"></i><span id="jobText"></span></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p class="big">Nothing saved yet</p>
    <p>Press <b>Sync</b> to list your Instagram saved posts, then <b>Pull</b> to download and transcribe them.</p>
    <p class="dim">From a terminal: <code>magpie sync</code> then <code>magpie pull</code>.</p>
  </div>
  <div id="more"></div>
</main>

<div class="viewer" id="viewer" hidden>
  <button class="x" id="vClose" aria-label="Close">&times;</button>
  <button class="nav prev" id="vPrev" aria-label="Previous">&#8249;</button>
  <button class="nav next" id="vNext" aria-label="Next">&#8250;</button>
  <div class="stage" id="vStage"></div>
  <aside>
    <div class="who">
      <a id="vAuthor" target="_blank" rel="noopener"></a>
      <span class="dim" id="vMeta"></span>
    </div>
    <div class="row">
      <button id="vSelect"></button>
      <button id="vCopy">Copy transcript</button>
    </div>
    <h2>Caption</h2>
    <div class="caption" id="vCaption"></div>
    <h2>Transcript <span class="dim" id="vStatus"></span></h2>
    <pre id="vTranscript"></pre>
  </aside>
</div>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
